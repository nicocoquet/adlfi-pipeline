[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tei-pactols-enricher"
version = "0.2.0"
description = "Préparation et enrichissement déterministes de fichiers XML-TEI AdlFI"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
  {name = "Nicolas Coquet"},
  {name = "Gaëlle David"},
]
dependencies = ["lxml>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
web = ["fastapi>=0.116", "httpx>=0.28", "uvicorn[standard]>=0.35"]

[project.scripts]
pactols-enrich = "pactols_enricher.cli:main"
pactols-enrich-batch = "pactols_enricher.batch:main"
tei-prepare = "xml_preparer.cli:main"
tei-prepare-batch = "xml_preparer.batch:main"

[tool.setuptools]
packages = ["pactols_enricher", "xml_preparer", "service"]
package-dir = {pactols_enricher = "src/pactols_enricher", xml_preparer = "src/xml_preparer", service = "service"}

[tool.pytest.ini_options]
testpaths = ["tests"]
