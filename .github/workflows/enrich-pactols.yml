name: Enrichissement PACTOLS

on:
  push:
    paths:
      - "input/**/*.xml"
      - "src/**/*.py"
      - "pyproject.toml"
      - ".gitignore"
      - ".github/workflows/enrich-pactols.yml"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: pactols-enrichment
  cancel-in-progress: false

env:
  PACTOLS_COMMIT: 69bf9697e24cefd645a69465bbd271702786285a
  PACTOLS_VERSION: PACTOLS 2026-07-22
  PACTOLS_DIRECTORY: pactols-latest-version/pactols_sujets_collection_20260722

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le pipeline
        uses: actions/checkout@v7

      - name: Récupérer la version figée de PACTOLS
        uses: actions/checkout@v7
        with:
          repository: nicocoquet/PACTOLS
          ref: ${{ env.PACTOLS_COMMIT }}
          path: pactols-reference
          sparse-checkout: ${{ env.PACTOLS_DIRECTORY }}
          lfs: true

      - name: Installer Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Vérifier les fichiers PACTOLS
        run: |
          grep -q '^<?xml' "pactols-reference/${PACTOLS_DIRECTORY}/Pactols_Sujets_P1-SUJETS.rdf"
          grep -q '^<?xml' "pactols-reference/${PACTOLS_DIRECTORY}/Pactols_Sujets_P1-CHRONOLOGIE.rdf"
          grep -q '^<?xml' "pactols-reference/${PACTOLS_DIRECTORY}/Pactols_Sujets_P2-Concepts dépréciés.rdf"

      - name: Installer le pipeline
        run: python -m pip install .

      - name: Enrichir les XML
        run: |
          pactols-enrich-batch input \
            --subjects "pactols-reference/${PACTOLS_DIRECTORY}/Pactols_Sujets_P1-SUJETS.rdf" \
            --chronology "pactols-reference/${PACTOLS_DIRECTORY}/Pactols_Sujets_P1-CHRONOLOGIE.rdf" \
            --deprecated "pactols-reference/${PACTOLS_DIRECTORY}/Pactols_Sujets_P2-Concepts dépréciés.rdf" \
            --output-dir generated/xml \
            --reports-dir generated/reports \
            --pactols-version "${PACTOLS_VERSION} (${PACTOLS_COMMIT})"

      - name: Publier les résultats dans le dépôt
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/xml generated/reports
          if git diff --cached --quiet; then
            echo "Aucune modification à publier."
            echo "published=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: enrichir les XML avec PACTOLS"
            git push
            echo "published=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Signaler les fichiers enrichis disponibles
        if: steps.publish.outputs.published == 'true' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require("fs");
            const { execFileSync } = require("child_process");

            const changedReports = execFileSync(
              "git",
              [
                "diff-tree",
                "--no-commit-id",
                "--name-only",
                "-r",
                "HEAD",
                "--",
                "generated/reports",
              ],
              { encoding: "utf8" },
            )
              .trim()
              .split("\n")
              .filter((path) => path.endsWith("_report.txt") && fs.existsSync(path));

            const value = (report, label) => {
              const match = report.match(new RegExp(`^${label} : (.+)$`, "m"));
              return match ? match[1] : "0";
            };
            const commit = execFileSync("git", ["rev-parse", "HEAD"], {
              encoding: "utf8",
            }).trim();

            for (const reportPath of changedReports) {
              const report = fs.readFileSync(reportPath, "utf8");
              const source = value(report, "Fichier");
              const base = source.replace(/\.xml$/i, "");
              const xmlPath = `generated/xml/${base}_enriched.xml`;
              const csvPath = `generated/reports/${base}_report.csv`;
              const repositoryUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}`;
              const fileUrl = (path) => `${repositoryUrl}/blob/${commit}/${path}`;
              const body = [
                `@${context.repo.owner} — le traitement PACTOLS est terminé.`,
                "",
                `| Indicateur | Résultat |`,
                `| --- | ---: |`,
                `| Concepts rencontrés | ${value(report, "Concepts rencontrés")} |`,
                `| Correspondances exactes | ${value(report, "indexed_exact")} |`,
                `| Équivalences typographiques | ${value(report, "indexed_typographic")} |`,
                `| Libellés alternatifs | ${value(report, "indexed_altlabel")} |`,
                `| Libellés alternatifs typographiques | ${value(report, "indexed_altlabel_typographic")} |`,
                `| Avertissements | ${value(report, "Avertissements")} |`,
                `| Exceptions à examiner | ${value(report, "Exceptions")} |`,
                "",
                `- [Télécharger le XML enrichi](${fileUrl(xmlPath)})`,
                `- [Lire le rapport TXT](${fileUrl(reportPath)})`,
                `- [Ouvrir le rapport CSV](${fileUrl(csvPath)})`,
                "",
                `Référentiel : ${value(report, "Référentiel PACTOLS")}`,
                `Commit de génération : \`${commit}\``,
              ].join("\n");

              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `PACTOLS — ${source} traité`,
                body,
                assignees: [context.repo.owner],
              });
            }

      - name: Conserver les résultats comme artefact
        uses: actions/upload-artifact@v6
        with:
          name: enrichissement-pactols
          path: generated/
